name: Camera CI and Development OTA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camera-${{ github.ref == 'refs/heads/main' && 'dev-latest' || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAMERA_BUILD_TIME_UTC: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || 'unknown' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.2"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify, test, lint and assemble exact commit
        run: |
          gradle --no-daemon --stacktrace \
            :app:verifyApi23Baseline \
            :app:testDevOtaUnitTest \
            :app:lintDevOta \
            :app:assembleDevOta

      - name: Verify APK identity, minSdk and signer
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/devOta/app-devOta.apk"
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.sahidcode404.camera'"
          echo "$BADGING" | grep -q "sdkVersion:'23'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          SIGNER_SHA="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apksigner.txt | tr 'A-F' 'a-f' | head -n1)"
          test "$SIGNER_SHA" = "194bea7868e8a5d4a20d0dc22474e15f3f617eeb90471d2cd7ea405d341774e1"
          cp "$APK" Camera-dev.apk
          SHA="$(sha256sum Camera-dev.apk | awk '{print $1}')"
          SIZE="$(stat -c '%s' Camera-dev.apk)"
          VERSION_CODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n1)"
          VERSION_NAME="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
          printf 'sha=%s\nsize=%s\nversion_code=%s\nversion_name=%s\nsigner_sha=%s\n' "$SHA" "$SIZE" "$VERSION_CODE" "$VERSION_NAME" "$SIGNER_SHA" >> "$GITHUB_OUTPUT"

      - name: Generate update metadata
        env:
          APK_SHA: ${{ steps.verify_apk.outputs.sha }}
          APK_SIZE: ${{ steps.verify_apk.outputs.size }}
          VERSION_CODE: ${{ steps.verify_apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.verify_apk.outputs.version_name }}
          SIGNER_SHA: ${{ steps.verify_apk.outputs.signer_sha }}
        run: |
          python3 - <<'PY'
          import json, os
          payload = {
              "schema": 1,
              "channel": "development",
              "applicationId": "com.sahidcode404.camera",
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "minSdk": 23,
              "apk": "Camera-dev.apk",
              "size": int(os.environ["APK_SIZE"]),
              "sha256": os.environ["APK_SHA"],
              "signerSha256": os.environ["SIGNER_SHA"],
              "sourceCommit": os.environ["GITHUB_SHA"],
              "buildTime": os.environ.get("CAMERA_BUILD_TIME_UTC", "unknown"),
              "changelog": "Automated Development build",
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          python3 -m json.tool update.json >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Camera-dev-${{ github.run_number }}
          path: |
            Camera-dev.apk
            update.json
          if-no-files-found: error

      - name: Publish rolling Development release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f dev-latest "$GITHUB_SHA"
          git push origin refs/tags/dev-latest --force
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest --title "Camera Development" --prerelease --latest=false
          else
            gh release create dev-latest --title "Camera Development" --prerelease --latest=false --notes "Rolling Development OTA release."
          fi
          # Required publication order: APK first, metadata last.
          gh release upload dev-latest Camera-dev.apk --clobber
          gh release upload dev-latest update.json --clobber
